# asia2 専用の drop-in（#15、docs/asia-role-split.md）。
# /etc/systemd/system/isureal-go.service.d/10-asia2.conf に置く。本体の unit は etc/systemd/isureal-go.service と同じ。
# asia2 の env.sh は ISUREAL_REGION=asia、ISUREAL_DB_HOST=127.0.0.1 なので、そのまま使う。
# env.sh（EnvironmentFile）に同じ名前があると、そちらが優先される。
#
# セッションキャッシュ（#109、docs/session-cache-asia.md）との関係：
# この drop-in で asia2 のアプリを動かすと、asia のプロセスが asia1 と asia2 の2つになる。
# その状態では、どのサーバの env.sh にも ISUREAL_SESSION_CACHE_SOLE=1 を残してはいけない
# （ログアウトしたトークンが、もう一方のプロセスで最大 TTL（400ms）の間 有効のままになる）。
# asia2 のアプリを有効にする前に、asia1・europe1・america1 の env.sh から ISUREAL_SESSION_CACHE_SOLE を外して再起動すること。
# ISUREAL_SESSION_CACHE_REGIONS は全サーバで同じ値にすること（asia2 もこの env.sh の値をそのまま使う）。

[Unit]
After=postgresql.service
Wants=postgresql.service

[Service]
# VPC 内のアドレスだけで待ち受ける。asia1 の nginx からルーター経由で届く。
Environment=ISUREAL_LISTEN_ADDR=192.168.4.10:8080
# max_connections = 256 に対して、asia1、europe1、america1 の 64 × 3 = 192 と合わせて 240。init.sh と psql の分を残す。
# セッションをキャッシュするプロセス（既定は europe1 と america1）は、確かめ直し専用の接続を 4 本ずつ足す（#121、ISUREAL_SESSION_CACHE_MAX_IN_FLIGHT）ので 248。
# asia もキャッシュする（#109）なら asia1 にも 4 本足りて 252 になる。
Environment=ISUREAL_DB_MAX_CONNS=48
# 画像は asia1 で返すので、asia2 では画像本体をほとんどキャッシュしない。PostgreSQL のページキャッシュを削らない。
Environment=ISUREAL_IMAGE_CACHE_BYTES=67108864
Environment=GOMEMLIMIT=512MiB
# 本体の unit の GOGC=400（#71）を既定に戻す。ヒープを生きている分の2倍までに抑え、PostgreSQL のページキャッシュを削らない。
Environment=GOGC=100
