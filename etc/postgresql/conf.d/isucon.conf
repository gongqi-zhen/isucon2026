listen_addresses = '*'

# ---------------------------------------------------------------------------
# 接続数 (#5)
# アプリ 3 台 (asia1 / europe1 / america1) × MaxOpenConns 64 = 192 に、
# psql や pg_stat_statements の確認用の余裕を足した値。
# webapp/go/server.go の MaxOpenConns を変えたらここも見直すこと。
# 変更には PostgreSQL の再起動が必要。
# ---------------------------------------------------------------------------
max_connections = 256

# ---------------------------------------------------------------------------
# メモリ (#5)
# ※ asia2 のメモリ量は未確認。仮に 4GB と置いた値。実機で `free -h` を確認して調整すること。
#   shared_buffers       : メモリの 25% 程度
#   effective_cache_size : メモリの 50〜75% 程度（プランナへのヒントのみで確保はしない）
#   work_mem             : 接続数 × ソート数ぶん確保されうるので控えめに
# ---------------------------------------------------------------------------
shared_buffers = 1GB
effective_cache_size = 2560MB
work_mem = 8MB
maintenance_work_mem = 256MB

# SSD 前提のプランナ設定
random_page_cost = 1.1
effective_io_concurrency = 200

# チェックポイントの頻度を下げて書き込みの山を減らす
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# ---------------------------------------------------------------------------
# JIT (#56)
# asia2 の PostgreSQL は LLVM 付き（pg_jit_available() = t）で、既定では jit = on。
# SSE のまとめ取り（PendingNotifications、notification_hub.go）は、接続が約 800 を超えると
# 推定コストが jit_above_cost（10万）を超え、毎回 JIT のコンパイルが走る。
# 2,000 接続で計ると、JIT に 13〜133 ms かかり、実行は 38〜211 ms になった。jit = off なら 24 ms。
# このアプリのクエリは短いものばかりで、JIT で速くなるものはない。
# 変更は reload で反映される（再起動は不要）。
# ---------------------------------------------------------------------------
jit = off

# ---------------------------------------------------------------------------
# COMMIT で WAL の fsync を待たない (#100)
# on のままだと、COMMIT のたびに WAL の fsync が終わるまで応答せず、その間は行ロックも持ったままになる。
# 投稿と RealMoji は画像（約450KB）を同じトランザクションで INSERT するので、その分の WAL も待つ。
# そのあいだ、本人の users 行と、そのリージョンの posting_windows 行（FOR SHARE）を持ち続ける。
#
# off で失われうるのは、PostgreSQL がクラッシュした（電源断、OOM killer で backend が落ちたなど）ときに、
# その直前の最大 wal_writer_delay の3倍（既定 200ms × 3）の間に COMMIT したトランザクションだけ。
# DB が壊れることはない（fsync と full_page_writes は on のまま。これらは off にしないこと）。
# 通常の再起動（reboot、systemctl restart）では、停止のときに WAL を書き切るので失われない。
# manual.md の追試（再起動したあと、負荷走行で書いたデータが読めるか）は、この場合にあたる。
# COMMIT した結果がほかの接続から見えるタイミングは、on と同じ（fsync を待つかどうかとは関係ない）。
# 変更は reload で反映される（再起動は不要）。
# ---------------------------------------------------------------------------
synchronous_commit = off

# ---------------------------------------------------------------------------
# 計測 (#2)
# pg_stat_statements は shared_preload_libraries に入れて再起動したあと、
# DB で一度だけ `CREATE EXTENSION IF NOT EXISTS pg_stat_statements;` を実行する。
# 確認例:
#   SELECT calls, round(total_exec_time) AS total_ms, round(mean_exec_time::numeric, 2) AS mean_ms, query
#   FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;
# リセット: SELECT pg_stat_statements_reset();
# ---------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on
# pg_stat_wal の wal_write_time と wal_sync_time を記録する（#100 の効果の計測）。
track_wal_io_timing = on

# slow query log。計測を終えたら -1 にしてログ出力を止める。
log_min_duration_statement = -1
