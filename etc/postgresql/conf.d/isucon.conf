listen_addresses = '*'

# ---------------------------------------------------------------------------
# 接続数 (#5)
# アプリ 3 台 (asia1 / europe1 / america1) × MaxOpenConns 64 = 192 に、
# psql や pg_stat_statements の確認用の余裕を足した値。
# webapp/go/server.go の MaxOpenConns を変えたらここも見直すこと。
# 変更には PostgreSQL の再起動が必要。
# ---------------------------------------------------------------------------
max_connections = 256

# ---------------------------------------------------------------------------
# メモリ (#5)
# ※ asia2 のメモリ量は未確認。仮に 4GB と置いた値。実機で `free -h` を確認して調整すること。
#   shared_buffers       : メモリの 25% 程度
#   effective_cache_size : メモリの 50〜75% 程度（プランナへのヒントのみで確保はしない）
#   work_mem             : 接続数 × ソート数ぶん確保されうるので控えめに
# ---------------------------------------------------------------------------
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 256MB

# SSD 前提のプランナ設定
random_page_cost = 1.1
effective_io_concurrency = 200

# チェックポイントの頻度を下げて書き込みの山を減らす
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# synchronous_commit = off は、再起動後にデータが残ることの要件と照らして別途検討する（ここでは変更しない）。

# ---------------------------------------------------------------------------
# 計測 (#2)
# pg_stat_statements は shared_preload_libraries に入れて再起動したあと、
# DB で一度だけ `CREATE EXTENSION IF NOT EXISTS pg_stat_statements;` を実行する。
# 確認例:
#   SELECT calls, round(total_exec_time) AS total_ms, round(mean_exec_time::numeric, 2) AS mean_ms, query
#   FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;
# リセット: SELECT pg_stat_statements_reset();
# ---------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on

# slow query log。計測を終えたら -1 にしてログ出力を止める。
log_min_duration_statement = 100
