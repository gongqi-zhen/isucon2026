server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # SSE（#60）。通知をすぐに転送し、待っている間に既定の60秒で切らない。
  # 切れてからつなぎ直すまでに始まった投稿期間の通知は、接続した時刻より前に作られたものとして届かないため。
  # アプリへは HTTP/1.1 でつなぐ（asia1 の isureal-split.conf と同じ）。HTTP/1.0 では、アプリが応答の途中で
  # 接続を切っても、nginx が正常に終わった応答と区別できない（#68 のエクスポートのストリーミングが、これを前提にする）。
  location = /api/notifications {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://127.0.0.1:8080;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:8080;
  }

  location / {
    try_files $uri /index.html;
  }
}
