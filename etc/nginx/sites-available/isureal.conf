# アプリへの接続を使い回す（#99）。upstream の keepalive がないと、proxy_http_version 1.1 でも
# nginx はリクエストごとにアプリへの TCP 接続を作って閉じる。
# keepalive はワーカーごとに残しておくアイドルの接続の数で、同時に使える接続の上限ではない。
# Go の http.Server は既定でアイドルの接続を閉じないので、閉じるのは nginx の側（keepalive_timeout）だけになる。
# 名前は isureal-split.conf の upstream（isureal_app、isureal_local）と分ける。
upstream isureal_go {
  server 127.0.0.1:8080;
  keepalive 64;
  keepalive_requests 10000;
  keepalive_timeout 60s;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # アプリへは HTTP/1.1 でつなぐ（asia1 の isureal-split.conf と同じ）。keepalive にはこの2つが要る。
  # HTTP/1.0 では、アプリが応答の途中で接続を切っても、nginx が正常に終わった応答と区別できない
  # （#68 のエクスポートのストリーミングが、これを前提にする）。
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";

  # SSE（#60）。通知をすぐに転送し、待っている間に既定の60秒で切らない。
  # 切れてからつなぎ直すまでに始まった投稿期間の通知は、接続した時刻より前に作られたものとして届かないため。
  location = /api/notifications {
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://isureal_go;
  }

  # 画像（1枚 約450KB）とエクスポートの ZIP（数MB以上）は、既定の proxy バッファ（8 x 4k|8k）に収まらず、
  # 収まらない分を /var/lib/nginx/proxy の一時ファイルに書いてから送っていた（#99）。
  # バッファを使わずに、アプリが書いた分をそのままクライアントに流す。
  # 画像はアプリのメモリのキャッシュから返し、エクスポートはアプリが組み立てながら書く（#68）ので、どちらもバッファは要らない。
  location /api/images/ {
    proxy_buffering off;
    proxy_pass http://isureal_go;
  }

  location = /api/me/export {
    proxy_buffering off;
    proxy_pass http://isureal_go;
  }

  location /api/ {
    proxy_pass http://isureal_go;
  }

  location / {
    try_files $uri /index.html;
  }
}
