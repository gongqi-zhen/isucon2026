# asia1 専用。asia の API を asia1 と asia2 の Go アプリに振り分ける（#15、docs/asia-role-split.md）。
# isureal.conf の代わりに sites-enabled に入れる。europe1 と america1 では使わない。
#
# - asia2 宛ての通信は 192.168.4.10 宛てなので、DB と同じくルーターを経由する。
# - asia2 のアプリが落ちていても、接続に失敗した時点で asia1 に回す（proxy_next_upstream の既定値 error timeout）。
#   リクエストを送ったあとのタイムアウトでは、POST などを再送しない（non_idempotent を付けない）。

upstream isureal_app {
  server 127.0.0.1:8080 weight=1 max_fails=3 fail_timeout=5s;
  server 192.168.4.10:8080 weight=1 max_fails=3 fail_timeout=5s;
  keepalive 128;
}

# 初期化、画像、guard が失敗を数える操作は asia1 のアプリだけで処理する。
# - 初期化：init.sh を1回だけ実行し、asia1 のプロセス内キャッシュを確実に消す。
# - 画像：画像本体のキャッシュ（ISUREAL_IMAGE_CACHE_BYTES）を asia1 に集め、メモリに余裕のない asia2 で持たない。
upstream isureal_local {
  server 127.0.0.1:8080;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # location で proxy_set_header を書くと、ここの設定が引き継がれなくなるので、ここにまとめる。
  # X-Client-IP と X-Country-Code は、そのまま転送される。
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  # asia2 が応答しないときに、すぐ asia1 に回す。
  proxy_connect_timeout 1s;

  location = /api/initialize {
    proxy_pass http://isureal_local;
  }

  location /api/images/ {
    proxy_pass http://isureal_local;
  }

  # isureal-guard はサーバごとに自分の journal から失敗を数える（login、invalid_signature、invalid_image）。
  # 数え方を今と同じにするため、これらの操作は asia1 のアプリだけで処理する。BAN の結果は DB の ip_bans で全アプリに効く。
  location /api/auth/ {
    proxy_pass http://isureal_local;
  }

  location = /api/me/profile-image {
    proxy_pass http://isureal_local;
  }

  # SSE。通知は DB をポーリングして検知するので、どちらのアプリに繋がっても届く。
  location = /api/notifications {
    proxy_buffering off;
    proxy_pass http://isureal_app;
  }

  location /api/ {
    proxy_pass http://isureal_app;
  }

  location / {
    try_files $uri /index.html;
  }
}
