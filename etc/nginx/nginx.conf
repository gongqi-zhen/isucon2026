user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;
# worker_connections を上げると、systemd の既定のソフト上限（1024）を超えるので、ワーカーの上限も上げる（#99）。
worker_rlimit_nofile 16384;

events {
	# SSE は1本でクライアント側とアプリ側の2つの接続を使い、アプリへの keepalive の接続も数に入る（#99）。
	# 以前の 768 では、ワーカー1つあたり SSE が約380本で埋まる。
	worker_connections 4096;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	# alp 集計用の LTSV 形式（例: alp ltsv --file /var/log/nginx/access.log -m '/api/images/.+,/api/posts/.+,...'）
	# 計測を終えたら access_log off; にして書き込みコストを減らす。
	log_format ltsv "time:$time_local"
		"\thost:$remote_addr"
		"\tclient_ip:$http_x_client_ip"
		"\tcountry:$http_x_country_code"
		"\tforwardedfor:$http_x_forwarded_for"
		"\treq:$request"
		"\tmethod:$request_method"
		"\turi:$request_uri"
		"\tstatus:$status"
		"\tsize:$body_bytes_sent"
		"\treferer:$http_referer"
		"\tua:$http_user_agent"
		"\treqtime:$request_time"
		"\truntime:$upstream_http_x_runtime"
		"\tapptime:$upstream_response_time"
		"\tcache:$upstream_http_x_cache"
		"\taccept_encoding:$http_accept_encoding"
		"\tcontent_encoding:$sent_http_content_encoding"
		"\tvhost:$host";

	access_log off;

	##
	# Gzip Settings
	##

	gzip on;

	# API の JSON の応答を圧縮する（#73）。ルーターは帯域を制限しているので、フィードなど数十KBの応答を小さくする。
	# 圧縮するのは Accept-Encoding: gzip を送ったクライアントにだけ。応答の中身は変わらない。
	# - 画像（image/jpeg）と ZIP は圧縮しても小さくならないので入れない。
	# - SSE（text/event-stream）は入れない。圧縮のバッファで通知が遅れるおそれがある。
	# - 応答はすべて Go のアプリからのプロキシなので、gzip_proxied any にする（ルーターが Via を付けても圧縮する）。
	# - asia1 は CPU が限界に近いので、圧縮のレベルは最低の 1 にする。CPU が足りなければ asia1 だけ gzip_types を外す。
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 1;
	gzip_min_length 1024;
	gzip_types application/json;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


